<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="72"/></filter>
    <linearGradient id="base" x1="180" y1="90" x2="1410" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#31001E"/>
      <stop offset="0.5" stop-color="#17181C"/>
      <stop offset="1" stop-color="#0F1013"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB629"/>
      <stop offset="0.48" stop-color="#FF6A35"/>
      <stop offset="1" stop-color="#EE3B25"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint"><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="soft-light"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <g filter="url(#blur)" opacity="0.94">
    <ellipse cx="375" cy="745" rx="460" ry="260" fill="#A0075D"/>
    <ellipse cx="1090" cy="348" rx="520" ry="190" fill="url(#flare)"/>
    <ellipse cx="1420" cy="850" rx="350" ry="260" fill="#FFB629" fill-opacity="0.42"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.58"/>
</svg>
